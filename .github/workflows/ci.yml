# CI for the MQLConnector repository: Windows (the DLL, its tests, its exports and imports) and
# macOS and Linux (the platform-neutral core and transport, clang, -Werror).
name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-x64-release
      - name: Build
        run: cmake --build --preset windows-x64-release
      - name: Test
        run: ctest --preset windows-x64-release
      - name: Check exports and dependencies
        shell: pwsh
        run: ./.github/scripts/check-dll.ps1 build/windows-x64-release/MQLConnector.dll
      - uses: actions/upload-artifact@v4
        with:
          name: MQLConnector
          path: build/windows-x64-release/MQLConnector.dll

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          brew install ninja llvm
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset macos-dev
      - name: Build
        run: cmake --build --preset macos-dev
      - name: Test
        run: ctest --preset macos-dev

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux-dev
      - name: Build
        run: cmake --build --preset linux-dev
      - name: Test
        run: ctest --preset linux-dev
