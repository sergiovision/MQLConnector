# CI for the standalone MQLConnector repository. Inert while the folder lives inside
# FinCore (GitHub only reads workflows from the repository root's .github/).
name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake --preset windows-x64-release
      - name: Build
        run: cmake --build --preset windows-x64-release
      - name: Test
        run: ctest --preset windows-x64-release
      - name: Check exports and dependencies
        shell: pwsh
        run: |
          $dll = "build/windows-x64-release/MQLConnector.dll"
          dumpbin /nologo /exports $dll
          $deps = dumpbin /nologo /dependents $dll | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() } |
            Where-Object { $_ -notmatch 'MQLConnector' }
          $deps
          $bad = $deps | Where-Object { $_ -match '^(VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt|mscoree)' }
          if ($bad) { throw "unexpected runtime dependency: $bad" }
      - uses: actions/upload-artifact@v4
        with:
          name: MQLConnector
          path: build/windows-x64-release/MQLConnector.dll

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          brew install ninja llvm
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset macos-dev
      - name: Build
        run: cmake --build --preset macos-dev
      - name: Test
        run: ctest --preset macos-dev
